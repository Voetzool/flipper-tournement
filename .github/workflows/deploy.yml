name: Test en publiceer op GitHub Pages

on:
  push:
    branches: [main, claude/sharp-thompson-fr3ldi]
  workflow_dispatch:
  # Elke maandagochtend opnieuw bouwen met de nieuwste OPDB-gegevens (werkt vanaf de standaardbranch).
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Rulesheets (Pinball Rulesheets, CC0) ophalen
        run: |
          git clone --depth 1 https://github.com/heyrocker/pinballrules "$RUNNER_TEMP/pinballrules" || echo "::warning::pinballrules niet opgehaald"
          node scripts/build-rules.mjs "$RUNNER_TEMP/pinballrules"
      - name: Kastencatalogus (OPDB via Match Play) ophalen
        run: node scripts/build-catalog.mjs
      - run: npm run build
      - name: Pi-versie bouwen (server + app in één pakket)
        run: |
          npm run build:server
          mkdir -p dist/pi
          tar -czf dist/pi/pinball-tournament.tar.gz -C dist-server .
          cp server/install.sh dist/pi/install.sh
          node scripts/build-handleiding.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
